name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check lib/ generate_receipt.py || true
      - name: Check Python syntax
        run: |
          python -m py_compile generate_receipt.py
          python -m py_compile lib/*.py
