<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Report — joyehuang.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: hsl(210 33% 99%);
    --bg-card: hsl(0 0% 100%);
    --bg-card-hover: hsl(240 4.8% 95.9%);
    --border: hsl(240 5.9% 88%);
    --border-hover: hsl(240 5.9% 80%);
    --text: hsl(240 10% 3.9%);
    --text-dim: hsl(240 3.8% 46.1%);
    --text-muted: hsl(240 3.8% 60%);
    --accent: hsl(200 29% 45%);
    --accent-warm: hsl(200 29% 45%);
    --accent-cool: hsl(200 29% 45%);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(240 20.54% 5.2%);
      --bg-card: hsl(240 10% 3.9%);
      --bg-card-hover: hsl(240 3.7% 15.9%);
      --border: hsl(240 3.7% 15.9%);
      --border-hover: hsl(240 3.7% 25%);
      --text: hsl(0 0% 98%);
      --text-dim: hsl(240 5% 74.9%);
      --text-muted: hsl(240 5% 50%);
      --accent: hsl(195 95% 85%);
      --accent-warm: hsl(195 95% 85%);
      --accent-cool: hsl(195 95% 85%);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .site-header {
    margin-bottom: 48px;
    animation: fadeUp 0.8s ease forwards;
    opacity: 0;
  }

  .site-header .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .site-header h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .site-header h1 span {
    color: var(--accent);
  }

  .site-header .subtitle {
    font-size: 15px;
    color: var(--text-dim);
    max-width: 400px;
  }

  .featured {
    margin-bottom: 48px;
    animation: fadeUp 0.8s ease 0.15s forwards;
    opacity: 0;
  }

  .featured-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .featured-label::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #4ade80;
    border-radius: 50%;
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
  }

  .featured-card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .featured-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .featured-card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .featured-card:hover::before {
    opacity: 0.6;
  }

  .featured-card .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .featured-card .title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .featured-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .stat {
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .stat .lbl {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .archive {
    animation: fadeUp 0.8s ease 0.3s forwards;
    opacity: 0;
  }

  .archive-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .archive-header h2 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  .archive-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .archive-item {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
  }

  .archive-item:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
  }

  .archive-item .arc-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .archive-item .arc-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .archive-item .arc-meta {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
  }

  .footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    animation: fadeUp 0.8s ease 0.45s forwards;
    opacity: 0;
  }

  .footer a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    transition: color 0.2s;
  }

  .footer a:hover {
    color: var(--accent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .container { padding: 32px 16px; }
    .site-header h1 { font-size: 32px; }
    .featured-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat .num { font-size: 16px; }
    .archive-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">

  <header class="site-header">
    <div class="brand">joyehuang.me</div>
    <h1>Agent <span>Report</span></h1>
    <p class="subtitle">Daily &amp; weekly insights from AI-assisted workflows. Generated by Hermes Agent.</p>
  </header>

  <section class="featured">
    <div class="featured-label">Latest</div>
    <a class="featured-card" href="archive/joye-receipt-2026-05-03.html">
      <div class="date">May 3, 2026</div>
      <div class="title">Daily Receipt — May 3</div>
      <div class="featured-stats">
        <div class="stat">
          <div class="num">11.9M</div>
          <div class="lbl">Tokens</div>
        </div>
        <div class="stat">
          <div class="num">11</div>
          <div class="lbl">Sessions</div>
        </div>
        <div class="stat">
          <div class="num">249</div>
          <div class="lbl">Messages</div>
        </div>
      </div>
    </a>
  </section>

  <section class="archive">
    <div class="archive-header">
      <h2>Archive</h2>
      <span class="archive-count">1 report</span>
    </div>
    <div class="archive-grid">
      <a class="archive-item" href="archive/joye-receipt-2026-05-03.html">
        <div class="arc-date">2026-05-03</div>
        <div class="arc-title">Daily Receipt — May 3</div>
        <div class="arc-meta">
          <span>11 sessions</span>
          <span>11.9M tokens</span>
        </div>
      </a>
    </div>
  </section>

  <footer class="footer">
    <a href="https://joyehuang.me" target="_blank">joyehuang.me</a>
  </footer>

</div>

</body>
</html>
